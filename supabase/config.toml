# ============================================================================
# verify_jwt overrides
# ============================================================================
#
# By default, `supabase functions deploy` sets verify_jwt=true per call,
# OVERWRITING the function's previously-deployed setting. This config.toml
# locks the correct setting at the file layer so the CLI honors it on every
# deploy (no per-call `--no-verify-jwt` flag required). Closes Lock #72.
#
# Two categories need verify_jwt=false:
#
#   1. PUBLIC-FRONTEND FUNCTIONS — called from anonymous browsers (no
#      authenticated session). Gateway JWT check would 401 every request.
#      These functions perform their own input validation.
#
#   2. WEBHOOK ENDPOINTS — authenticate via provider-specific signatures
#      (Stripe HMAC, Resend svix, LearnWorlds pre-shared signature), not Supabase JWT.

# --- Category 1: Public-frontend functions ---

[functions.resend-waitlist]
verify_jwt = false

[functions.record-quiz-completion]
verify_jwt = false

[functions.record-diagnostic-completion]
verify_jwt = false

[functions.submit-feedback]
verify_jwt = false

# Partner / collaborator / co-op / investor inquiries from the public marketing
# site. Anonymous callers; the EF does its own validation. Capture-then-book.
[functions.submit-partner-inquiry]
verify_jwt = false

# Corrections reported by families from /homeschool/updates, the page the printed books
# point at. Anonymous callers; the EF validates and rate-limits. Added 2026-09-22.
[functions.submit-curriculum-correction]
verify_jwt = false

# ESA invoice form on /esa/<state> (Arizona, Arkansas, Alabama, New Hampshire). Anonymous
# families; the EF validates, rate-limits and issues the invoice itself. Added 2026-09-14.
[functions.esa-invoice]
verify_jwt = false

# ESA payments (added 2026-09-15). esa-payment is service-role only: payment intake from
# scripts/esa_payment_intake.py, manual mark_paid, and the daily reminder pass from the Vercel
# cron. It relies on isServiceRoleRequest, which is only safe at verify_jwt = true.
[functions.esa-payment]
verify_jwt = true

# The founder's one-tap Confirm paid page, opened from an email link. The credential is a
# single-use random token; the GET only shows the invoice, the POST button marks it paid.
[functions.esa-payment-confirm]
verify_jwt = false

# partner-welcome sends the founding-partner welcome email (6-week sample
# attached). Gated by FOUNDERS_ADMIN_TOKEN in x-partner-admin, so the gateway
# JWT check must not block the admin caller. The sample PDF lives in the
# PRIVATE partner-assets Storage bucket (bundling it 413'd the deploy); swap
# the sample by re-uploading to the same Storage path, no redeploy needed.
[functions.partner-welcome]
verify_jwt = false

# constitution-pdf renders the PAID Deep-Dive Guide. It is fetched server-side by
# stripe-webhook (service role) on purchase, and the function additionally requires
# role=service_role. verify_jwt MUST stay true so that claim check cannot be forged.
[functions.constitution-pdf]
verify_jwt = true

# studio-generate, studio-image and canva-connect removed 2026-07-26 with the rest
# of the Ad Studio. They must also be UNDEPLOYED from the project; deleting the
# source alone leaves the old bundles serving in production, still holding the LLM,
# Gemini and Canva provider secrets.

# practitioner-waitlist-signup and tier-2-waitlist-signup removed 2026-09-15
# (retired signups, no caller). They must also be UNDEPLOYED from the project;
# their existing waitlist rows are kept.

# Per-list one-click unsubscribe (RFC 8058). Called from email clients and
# browsers with no Supabase session; security is the signed token, not a JWT.
[functions.unsubscribe]
verify_jwt = false

# Public founding-500 counter for /preorder ({ sold, cap, closed }; read-only,
# no order data). Called anonymously from the PreorderBuyBox island.
# Founding-kit counter. Kit preorders closed 2026-09-12; kept for the /preorder notice.
[functions.preorder-status]
verify_jwt = false

# Buyer's own order for /books/thank-you, proven by the Stripe Checkout session
# id from the success redirect. Anonymous caller, no JWT; exposes no card,
# phone or street address.
[functions.print-order-status]
verify_jwt = false

# A buyer's one-click answer to an FTC delay notice (consent or cancel). Reached
# from an email link with no Supabase session, so verify_jwt MUST stay false;
# security is the HMAC token, not a JWT. 435.2(b)(3) requires the cancellation
# mechanism to be free and easy, and a login gate would not satisfy that.
[functions.preorder-response]
verify_jwt = false

# Stripe Checkout session creator. Does its OWN auth dispatch internally
# (subscriptions + nb_addon check the JWT in code; anonymous one-offs and
# preorders don't). verify_jwt MUST stay false: true at the gateway blocks
# anonymous purchases (the original Phase 5 #4 silent-fail bug). This entry
# was missing from the Lock #72 list, so a routine 2026-07-18 redeploy
# silently flipped the function to verify_jwt=true (401s for non-invoke
# callers) until it was caught and redeployed with --no-verify-jwt.
[functions.create-checkout]
verify_jwt = false

# Straight-to-checkout redirect for the Deep-Dive Guide, clicked anonymously
# from nurture emails. Plain HTTP 302 to a Stripe session; no Supabase JWT.
[functions.guide-checkout]
verify_jwt = false

# Emailed Deep-Dive Guide access links (2026-09-15). Anonymous visitors on
# /guide/<slug> request a link and open it with no Supabase session; security is
# the signed, expiring HMAC token plus the per-IP / per-email rate buckets.
[functions.guide-access-link]
verify_jwt = false

# --- Category 2: Webhook endpoints ---

[functions.resend-webhook]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# TEST-ONLY twins of create-checkout / stripe-webhook (Stripe test key, token-gated,
# never queue a Lulu print). See supabase/functions/_shared/e2e-mode.ts.
[functions.create-checkout-e2e]
verify_jwt = false

[functions.stripe-webhook-e2e]
verify_jwt = false

# LearnWorlds course-purchase webhook. Authenticity = Learnworlds-Webhook-Signature,
# a STATIC pre-shared value compared in constant time (not an HMAC of the body;
# see learnworlds-webhook/index.ts header), not a Supabase JWT.
[functions.learnworlds-webhook]
verify_jwt = false

# Lulu print-job status webhook (print-on-demand books). Authenticity is the
# Lulu-HMAC-SHA256 signature over the raw body, keyed with our Lulu client
# secret, not a Supabase JWT. Deploy with --no-verify-jwt.
[functions.lulu-webhook]
verify_jwt = false

# Retired founders-lock flow. CLOSED=true in code, returns 410.
[functions.founders-lock]
verify_jwt = false

# --- Category 3: Internal cron workers ---
#
# Invoked only server-to-server by the Vercel crons (api/cron/*) with the
# service-role key. They each additionally require role=service_role in the
# inbound JWT (via _shared/require-service-role.ts) so the public anon key
# cannot trigger them. verify_jwt MUST stay true so the gateway validates the
# signature and the role claim cannot be forged.
[functions.notify-founder-digest]
verify_jwt = true

[functions.founder-evening-recap]
verify_jwt = true

[functions.nurture-emails]
verify_jwt = true

[functions.weekly-trends-digest]
verify_jwt = true

[functions.replay-quiz-completion-failures]
verify_jwt = true

# launch-email-preview mails the founder a copy of each launch email a day early.
# Invoked only by the Vercel cron with the service-role key; it additionally
# requires role=service_role via _shared/require-service-role.ts, so verify_jwt
# MUST stay true or that claim check could be forged.
[functions.launch-email-preview]
verify_jwt = true

# starter-fulfill stamps and delivers the paid Starter Unit PDFs. It bundles the
# service-role key and mints signed URLs for paid content, so it is invoked only
# server-to-server: by stripe-webhook on purchase, and by the Vercel cron drain.
# It additionally requires role=service_role via _shared/require-service-role.ts,
# so verify_jwt MUST stay true or that claim check could be forged.
[functions.starter-fulfill]
verify_jwt = true

# lulu-submit hands paid print-on-demand orders to Lulu (a real print order
# on our card). Invoked only server-to-server: by stripe-webhook on purchase
# and by the Vercel cron drain. Requires role=service_role via
# _shared/require-service-role.ts, so verify_jwt MUST stay true.
[functions.lulu-submit]
verify_jwt = true

# lulu-admin: founder-only Lulu actions (resubmit, cancel, refresh, validate
# files). Checks the founder's user JWT in code; the gateway validates the
# signature first.
[functions.lulu-admin]
verify_jwt = true

# list-announce mails the whole homeschool list. It is the single most dangerous
# function in the project by blast radius, so it is service-role only via
# _shared/require-service-role.ts and verify_jwt MUST stay true or that claim
# check could be forged. Nothing in a browser should be one request away from
# mailing 1,400 people.
[functions.list-announce]
verify_jwt = true

# podcast-announce mails the whole Tales & Table Talk list (punch #307). Same rule as
# list-announce: service-role only via _shared/require-service-role.ts, and verify_jwt
# MUST stay true.
[functions.podcast-announce]
verify_jwt = true

# contact-properties-sync projects funnel / band / purchase / quiz / engagement
# state from Postgres onto Resend contacts. Invoked only by the Vercel cron and
# by hand with the service-role key; it additionally requires role=service_role
# via _shared/require-service-role.ts, so verify_jwt MUST stay true.
[functions.contact-properties-sync]
verify_jwt = true

# --- Category 1 (continued): Public-frontend functions ---

# starter-download is the re-request flow for expired download links. The buyer
# clicks it straight from an email with no Supabase session, so the gateway JWT
# check must not block them. The per-purchase download_token IS the credential;
# the function validates it and rate-limits per token.
[functions.starter-download]
verify_jwt = false

# --- Category 4: Signed-in user and founder functions (explicit pins) ---
#
# These had no entry and relied on the CLI default of verify_jwt=true. Pinned
# explicitly so a stray --no-verify-jwt cannot flip them. Each validates the
# caller's JWT in code, which is only safe when the gateway has already
# verified the signature. (launch-email-preview, the fifth unpinned function,
# is pinned under Category 3.)

# founder-broadcast mails every preorder buyer (no unsend). Founder-email gate via
# auth.getUser() in code; the gateway validates the signature first.
[functions.founder-broadcast]
verify_jwt = true

# customer-portal: signed-in subscriber opens the Stripe billing portal (auth.getUser in code).
[functions.customer-portal]
verify_jwt = true

# practitioner-clinical: signed-in user, subscription_tier=practitioner checked in code.
[functions.practitioner-clinical]
verify_jwt = true

# verify-session proves a paid Checkout session. Anonymous guide callers send the
# anon key, which is a valid JWT; signed-in callers send the user JWT, which the
# function binds to the session's supabase_user_id. Pinned so a redeploy cannot
# silently flip it.
[functions.verify-session]
verify_jwt = true
