# CI — runs the test suite on every PR into main.
#
# Why this exists: before this workflow the repo had no CI at all. Tests ran
# only when someone remembered to run them locally. That is tolerable for UI
# work and NOT tolerable for the herb/pattern consistency tests, which guard
# clinical recommendation data — a silent regression there means a reader is
# shown a red "Avoid" flag on a herb their own guide recommends. That exact
# bug reached production once (it is what prompted this work), and a test
# nobody runs would not have caught it a second time.
#
# Package manager: npm. `npm ci` installs from package-lock.json, and
# README.md's Commands section uses npm. bun.lock and bun.lockb are not used
# by CI. deno.lock belongs to the Supabase Edge Functions, which deploy via
# the Supabase CLI and are not built here.
#
# Typecheck runs before tests via `npm run typecheck` (tsconfig.app.json).
# Do not use bare `tsc --noEmit` at the root: tsconfig.json is `files: []`
# plus references and exits 0 having checked nothing.
#
# The Edge Functions' shared unit tests (supabase/functions/_shared/*.test.ts)
# run under Deno after the Vitest suite. --no-lock keeps deno.lock untouched.
#
name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The job only checks out, installs and runs checks; it never writes to the repo.
permissions:
  contents: read

# A second push to the same PR cancels the first run still in flight.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci (not npm install) so the lockfile is authoritative and CI can
      # never silently resolve a different dependency tree than local dev.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge Function shared tests (Deno)
        run: deno test --no-lock --allow-env --allow-net --allow-read supabase/functions/_shared/
